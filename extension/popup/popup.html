<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booba</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">

    <!-- Header -->
    <header class="popup__header">
      <div class="popup__avatar">
        <img id="header-avatar" src="../assets/booba-calm.svg" alt="Booba" />
      </div>
      <div class="popup__header-text">
        <div class="popup__title">Booba</div>
        <div class="popup__subtitle">Trading Copilot</div>
      </div>
    </header>

    <!-- Status -->
    <section class="popup__section">
      <div id="status-badge" class="popup__status popup__status--inactive">
        <span class="popup__status-dot"></span>
        <span id="status-text">Checking...</span>
      </div>
    </section>

    <!-- Quick links -->
    <section class="popup__section">
      <div class="popup__section-label">Quick Links</div>
      <div class="popup__links">
        <button class="popup__link-btn" data-path="/">
          <span class="popup__link-icon">📒</span> Journal
        </button>
        <button class="popup__link-btn" data-path="/analytics">
          <span class="popup__link-icon">📊</span> Analytics
        </button>
        <button class="popup__link-btn" data-path="/trades">
          <span class="popup__link-icon">📈</span> Trades
        </button>
      </div>
    </section>

    <!-- Toggle -->
    <section class="popup__section">
      <div class="popup__toggle-row">
        <label class="popup__toggle-label" for="show-booba-toggle">
          Show Booba on Pacifica
        </label>
        <label class="popup__switch">
          <input type="checkbox" id="show-booba-toggle" checked />
          <span class="popup__switch-slider"></span>
        </label>
      </div>
    </section>

    <!-- Footer -->
    <footer class="popup__footer">
      <button id="open-options" class="popup__footer-link">Settings</button>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
