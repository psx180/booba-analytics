<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booba</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">

    <!-- Header -->
    <header class="popup__header">
      <div class="popup__title">🐴 BOOBA</div>
      <div id="status-badge" class="popup__conn popup__conn--disconnected">
        <span class="popup__status-dot"></span>
        <span id="status-text">Checking...</span>
      </div>
    </header>

    <!-- Open Dashboard -->
    <section class="popup__section">
      <button id="open-dashboard" class="popup__primary-btn">Open Dashboard</button>
    </section>

    <!-- Toggles -->
    <section class="popup__section">
      <div class="popup__toggle-row">
        <label class="popup__toggle-label" for="show-booba-toggle">
          Show floating Booba on Pacifica
        </label>
        <label class="popup__switch">
          <input type="checkbox" id="show-booba-toggle" checked />
          <span class="popup__switch-slider"></span>
        </label>
      </div>
      <div class="popup__toggle-row">
        <label class="popup__toggle-label" for="mute-alerts-toggle">
          Mute alerts
        </label>
        <label class="popup__switch">
          <input type="checkbox" id="mute-alerts-toggle" />
          <span class="popup__switch-slider"></span>
        </label>
      </div>
    </section>

    <!-- Footer -->
    <footer class="popup__footer">
      <button id="open-options" class="popup__footer-link">Advanced Settings</button>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
