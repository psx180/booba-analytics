<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="48" fill="#1e293b" stroke="#ef4444" stroke-width="3"/>
  <!-- Panic lines -->
  <line x1="10" y1="15" x2="20" y2="25" stroke="#ef4444" stroke-width="2" opacity="0.6"/>
  <line x1="90" y1="15" x2="80" y2="25" stroke="#ef4444" stroke-width="2" opacity="0.6"/>
  <line x1="5" y1="50" x2="15" y2="50" stroke="#ef4444" stroke-width="2" opacity="0.6"/>
  <line x1="95" y1="50" x2="85" y2="50" stroke="#ef4444" stroke-width="2" opacity="0.6"/>
  <!-- Huge panicked eyes -->
  <ellipse cx="34" cy="43" rx="9" ry="10" fill="#e2e8f0"/>
  <ellipse cx="66" cy="43" rx="9" ry="10" fill="#e2e8f0"/>
  <circle cx="34" cy="44" r="5" fill="#ef4444"/>
  <circle cx="66" cy="44" r="5" fill="#ef4444"/>
  <circle cx="35" cy="42" r="2" fill="#fff"/>
  <circle cx="67" cy="42" r="2" fill="#fff"/>
  <!-- Open screaming mouth -->
  <ellipse cx="50" cy="67" rx="10" ry="8" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
  <!-- Teeth -->
  <rect x="43" y="62" width="5" height="4" rx="1" fill="#e2e8f0"/>
  <rect x="50" y="62" width="5" height="4" rx="1" fill="#e2e8f0"/>
</svg>
