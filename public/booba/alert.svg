<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <!-- face -->
  <circle cx="30" cy="30" r="28" fill="#ca8a04"/>
  <!-- raised eyebrows -->
  <path d="M13 19 Q20 15 27 19" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M33 19 Q40 15 47 19" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- left eye - wide open -->
  <circle cx="20" cy="28" r="6.5" fill="white"/>
  <circle cx="20" cy="28" r="3.5" fill="#1e293b"/>
  <circle cx="21.5" cy="26.5" r="1" fill="white"/>
  <!-- right eye - wide open -->
  <circle cx="40" cy="28" r="6.5" fill="white"/>
  <circle cx="40" cy="28" r="3.5" fill="#1e293b"/>
  <circle cx="41.5" cy="26.5" r="1" fill="white"/>
  <!-- flat mouth -->
  <line x1="22" y1="42" x2="38" y2="42" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
</svg>
