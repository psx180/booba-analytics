<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <!-- face -->
  <circle cx="30" cy="30" r="28" fill="#ea580c"/>
  <!-- worried eyebrows (angled inward toward center) -->
  <path d="M13 21 L22 25" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M38 25 L47 21" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- left eye -->
  <circle cx="20" cy="29" r="5" fill="white"/>
  <circle cx="20" cy="29" r="2.5" fill="#1e293b"/>
  <!-- right eye -->
  <circle cx="40" cy="29" r="5" fill="white"/>
  <circle cx="40" cy="29" r="2.5" fill="#1e293b"/>
  <!-- wavy mouth -->
  <path d="M18 42 Q22 39 26 42 Q30 45 34 42 Q38 39 42 42" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- sweat drop -->
  <path d="M48 11 Q52 17 48 22 Q44 17 48 11 Z" fill="#93c5fd"/>
